        '404':
          description: Erreur de validation ou d'autorisation.
  /api/v1/management/reservations/:
    get:
      operationId: management_reservations_list
      description: Liste paginée de toutes les réservations pour le gestionnaire-comptable
        et l'administrateur. Accès refusé aux clients, mécaniciens, nettoyeurs et
        utilisateurs anonymes. Les mécaniciens/nettoyeurs consomment uniquement les
        données nécessaires via leurs interventions attribuées et un serializer limité.
      parameters:
      - in: query
        name: client
        schema:
          type: integer
        description: Filtrer par ID du client.
      - in: query
        name: client_email
        schema:
          type: string
        description: Rechercher par email du client (contient).
      - in: query
        name: client_first_name
        schema:
          type: string
        description: Rechercher par prénom du client (contient).
      - in: query
        name: client_last_name
        schema:
          type: string
        description: Rechercher par nom du client (contient).
      - in: query
        name: end_at
        schema:
          type: string
        description: 'Filtrer par date de fin exacte. Format: ISO 8601 datetime.'
      - in: query
        name: end_at_from
        schema:
          type: string
        description: 'Filtrer par date de fin (>=). Format: ISO 8601 datetime.'
      - in: query
        name: end_at_to
        schema:
          type: string
        description: 'Filtrer par date de fin (<=). Format: ISO 8601 datetime.'
      - in: query
        name: ordering
        schema:
          type: string
        description: 'Tri autorisé: created_at, -created_at, start_at, -start_at,
          rental_amount, -rental_amount.'
      - in: query
        name: page
        schema:
          type: integer
        description: Numéro de page (pagination).
      - in: query
        name: page_size
        schema:
          type: integer
        description: Nombre d'éléments par page.
      - in: query
        name: reference
        schema:
          type: string
        description: Rechercher par référence (contient).
      - in: query
        name: search
        schema:
          type: string
        description: Recherche globale (référence, email client, prénom, nom, immatriculation).
      - in: query
        name: start_at
        schema:
          type: string
        description: 'Filtrer par date de début exacte. Format: ISO 8601 datetime.'
      - in: query
        name: start_at_from
        schema:
          type: string
        description: 'Filtrer par date de début (>=). Format: ISO 8601 datetime.'
      - in: query
        name: start_at_to
        schema:
          type: string
        description: 'Filtrer par date de début (<=). Format: ISO 8601 datetime.'
      - in: query
        name: status
        schema:
          type: string
        description: Filtrer par statut de réservation (exact match).
      - in: query
        name: vehicle
        schema:
          type: integer
        description: Filtrer par ID du véhicule.
      - in: query
        name: vehicle_registration_plate
        schema:
          type: string
        description: Rechercher par immatriculation du véhicule (contient).
      tags:
      - Reservation Management
      security:
      - jwtAuth: []
      responses:
        '401':
          description: Erreur de validation ou d'autorisation.
        '403':
          description: Erreur de validation ou d'autorisation.
  /api/v1/management/reservations/{id}/:
    get:
      operationId: management_reservations_retrieve
      description: Récupère les détails d'une réservation pour le gestionnaire-comptable
        et l'administrateur. Aucun mot de passe, document d'identité complet, fichier
        de document ou donnée bancaire n'est exposé. Accès refusé aux clients, mécaniciens,
        nettoyeurs et anonymes.

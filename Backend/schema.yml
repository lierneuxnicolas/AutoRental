        '403':
          description: Erreur de validation ou d'autorisation.
    post:
      operationId: reservations_create
      description: Cree une reservation BROUILLON pour le client connecte. Le prix
        est recalcule cote Django et la disponibilite est reverifiee. Aucun paiement
        ni caution n'est cree a ce stade.
      tags:
